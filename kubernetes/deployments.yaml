apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelens-api
  labels:
    app: modelens-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelens-api
  template:
    metadata:
      labels:
        app: modelens-api
    spec:
      containers:
      - name: api
        image: modelens-api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: postgres-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: secret-key
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: sendgrid-api-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelens-worker
  labels:
    app: modelens-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelens-worker
  template:
    metadata:
      labels:
        app: modelens-worker
    spec:
      containers:
      - name: worker
        image: modelens-worker:latest
        command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.worker.celery_app
            - inspect
            - ping
            - -d
            - celery@$HOSTNAME
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: postgres-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: modelens-secrets
              key: redis-url
        - name: MLFLOW_URI
          valueFrom:
            configMapKeyRef:
              name: modelens-config
              key: mlflow-uri
---
apiVersion: v1
kind: Service
metadata:
  name: modelens-api-service
spec:
  selector:
    app: modelens-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: ClusterIP
