name: Backend Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

# Dummy values only. Tests run on SQLite with Redis, Celery and MLflow mocked in
# tests/conftest.py, so no real service or secret is needed.
env:
  TESTING: "true"
  SECRET_KEY: ci-dummy-secret-key-not-used-anywhere-real
  STRIPE_SECRET_KEY: sk_test_dummy
  PYTHONDONTWRITEBYTECODE: "1"

defaults:
  run:
    working-directory: backend

jobs:
  fast-tests:
    name: Fast tests (unit + API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/app/requirements.txt
            backend/tests/requirements-test.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r tests/requirements-test.txt

      - name: Every test belongs to exactly one job
        run: |
          count() { python -m pytest -q --collect-only "$@" | tail -1 | grep -oE '^[0-9]+'; }
          all=$(count)
          fast=$(count -m "not slow and not integration")
          slow=$(count -m "slow or integration")
          echo "all=$all fast=$fast slow/integration=$slow"
          test "$((fast + slow))" -eq "$all"

      - name: Run fast tests
        run: python -m pytest -n auto -m "not slow and not integration" -p no:cacheprovider -q -rxX --durations=15

  slow-integration-tests:
    name: Slow + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/app/requirements.txt
            backend/tests/requirements-test.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt -r tests/requirements-test.txt

      - name: Run slow and integration tests
        run: python -m pytest -n auto -m "slow or integration" -p no:cacheprovider -q -rxX --durations=15
